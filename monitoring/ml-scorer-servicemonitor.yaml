apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ml-scorer
  namespace: monitoring
  labels:
    app: ml-scorer
spec:
  namespaceSelector:
    matchNames: ["kubehealer"]
  selector:
    matchLabels:
      app: ml-scorer
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 3s
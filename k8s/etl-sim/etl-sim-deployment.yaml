apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-sim
  namespace: kubehealer
  labels:
    app: etl-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etl-sim
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: etl-sim
    spec:
      terminationGracePeriodSeconds: 10
      # Run as a non-root UID/GID so Kubelet is happy even if the image defaults to root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        # If you later mount writable volumes and hit permission issues, uncomment:
        # fsGroup: 1000
      containers:
        - name: etl-sim
          image: kubehealer/etl-sim:1.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            # --- app basics ---
            - name: APP_NAME
              value: "etl-sim"
            - name: METRICS_PORT
              value: "8000"
            - name: BATCH_SIZE       # must be an integer string
              value: "50"
            - name: WORK_INTERVAL_SEC
              value: "0.02"
            - name: LOG_JSON
              value: "true"

            # --- city tag (included in each JSON record) ---
            - name: CITY_NAME
              value: "dubai"

            # --- chaos knobs (legacy/system symptoms) ---
            - name: FAIL_RATE
              value: "0.02"
            - name: SLOW_RATE
              value: "0.05"
            - name: SLOW_MS
              value: "1200"

            # --- anomaly hysteresis (clear after N good heartbeats) ---
            - name: ANOMALY_CLEAR_WINDOWS
              value: "2"

            # --- legacy anomaly trigger thresholds ---
            - name: ANOMALY_FAIL_THRESH
              value: "0.05"
            - name: ANOMALY_SLOW_THRESH
              value: "0.10"

            # --- data anomaly thresholds (lite: temperature z-score only) ---
            - name: WEATHER_TEMP_SIGMA_C
              value: "3.0"
            - name: WEATHER_TEMP_Z_THRESH
              value: "3.8"
            - name: WEATHER_HEATWAVE_DELTA_C
              value: "0"

            # --- MinIO (disabled by default; enable later by filling these) ---
            - name: MINIO_ENDPOINT
              value: "minio.minio.svc.cluster.local:9002"
            - name: MINIO_ACCESS_KEY
              value: "minio"                # e.g. "minio"
            - name: MINIO_SECRET_KEY
              value: "minio123"                # e.g. "minio123"
            - name: MINIO_BUCKET
              value: "etl-bucket"
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_PREFIX
              value: "events"

          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8000

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
